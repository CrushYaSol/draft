<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Draft Game</title>
    <style>
        * {margin: 4px; padding: 0; box-sizing: border-box; font-family: sans-serif;}
        form * {margin: 0;}
        .center{
            display:flex;
            flex-direction: column;
            align-items: center;
            list-style: none;
        }
        .sameline{
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="center">
        <h1 id="auction_player"></h1>
        <h1 id="rating" aria-live="polite"></h1>
        <h3 id="turn_counter" aria-live="polite"></h3>
        <p id="money_counter">You have $20</p>
        <div class="sameline">
            <form>
                <button id="bid" type="submit">Bid</button>
                <input id="bid_amount" type="number" placeholder="Type your bid here" step="1">
            </form>
            <button id="pass" type="button">Pass</button>
        </div>
        <p id="message" aria-live="polite"></p>
        <p id="player1:" hidden>Player 1:</p>
        <ul id="player1_data"></ul>
        <p id="player2:" hidden>Player 2:</p>
        <ul id="player2_data"></ul>
    </div>
    <script src="Coding.js"></script>
    <noscript><p>"Please turn on scripts to play the game!"</p></noscript>
</body>
</html>
